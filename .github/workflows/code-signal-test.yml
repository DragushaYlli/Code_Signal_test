name: Code Signal Test CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hold the controlled cancellation run
        if: github.head_ref == 'code-signal/cancelled-pipeline-test'
        run: sleep 120

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
